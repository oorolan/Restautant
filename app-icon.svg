<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Inner subtle circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 6"/>

  <!-- Restaurant Cloche & Inventory Symbol -->
  <g transform="translate(106, 116) scale(1.2)" filter="url(#glow)">
    <!-- Cloche handle -->
    <circle cx="125" cy="45" r="14" fill="url(#goldGrad)"/>
    <!-- Cloche dome -->
    <path d="M 35 140 A 90 90 0 0 1 215 140 Z" fill="url(#goldGrad)"/>
    <!-- Cloche base tray -->
    <rect x="20" y="145" width="210" height="14" rx="7" fill="url(#goldGrad)"/>
    
    <!-- Checklist/Stock Box Overlay Inside Cloche Plate -->
    <g transform="translate(85, 80) scale(0.65)" fill="#0d0f14">
      <rect x="0" y="0" width="120" height="85" rx="10" fill="#0d0f14" opacity="0.9"/>
      <!-- Bars representing stock levels -->
      <rect x="20" y="20" width="80" height="10" rx="5" fill="#f59e0b"/>
      <rect x="20" y="40" width="55" height="10" rx="5" fill="#f59e0b"/>
      <rect x="20" y="60" width="70" height="10" rx="5" fill="#f59e0b"/>
    </g>
  </g>
</svg>
